# ── Configuración de TorchKatt Hermes (Windows) ──────────────
model:
  provider: deepseek
  default: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  context_length: 262144

fallback_providers:
  - provider: openrouter
    model: anthropic/claude-opus-4-8

agent:
  max_turns: 90
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  verify_on_stop: auto

# Ahorro de tokens: compacta el contexto antes (0.5 → 0.35)
# para que cada turno reenvíe menos tokens. 2026-08-19.
compression:
  enabled: true
  threshold: 0.25
  target_ratio: 0.2
  protect_last_n: 12

# Caché de prompts activa (DeepSeek cachea automáticamente server-side;
# los cache hits cuestan 50x menos que los misses).
prompt_caching:
  cache_ttl: 5m

toolsets:
  - web
  - browser
  - terminal
  - file
  - code_execution
  - vision
  - memory
  - session_search
  - delegation
  - cronjob
  - clarify
  - todo
  - skills

display:
  language: es
  interface: cli

memory:
  memory_enabled: true
  user_profile_enabled: true
